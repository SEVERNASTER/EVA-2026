name: eva-2026

# Postgres suelto (psql / DBeaver) en 54332 para no chocar con Supabase.
# La app (Auth + Postgres + Studio) se levanta con Docker vía: npm run db:up

services:
  db:
    image: postgres:17-alpine
    container_name: eva-2026-db
    restart: unless-stopped
    ports:
      - "54332:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - eva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eva_pgdata:
